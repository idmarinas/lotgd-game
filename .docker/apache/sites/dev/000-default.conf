# Main WebSite
<VirtualHost *:80>
	ServerName localhost
	#UseCanonicalName Off

	ErrorLog /usr/local/apache2/logs/error.log
	CustomLog /usr/local/apache2/logs/access.log combined

	Include conf/x/common.conf
</VirtualHost>

# Administration panel
<VirtualHost *:80>
	ServerName admin.localhost
	#UseCanonicalName Off

	SetEnv APP_ID admin

	ErrorLog /usr/local/apache2/logs/admin-error.log
	CustomLog /usr/local/apache2/logs/admin-access.log combined

	Include conf/x/common.conf
</VirtualHost>

# Api
<VirtualHost *:80>
	ServerName api.localhost
	#UseCanonicalName Off

	SetEnv APP_ID api

	ErrorLog /usr/local/apache2/logs/api-error.log
	CustomLog /usr/local/apache2/logs/api-access.log combined

	Include conf/x/common.conf
</VirtualHost>
