# Main WebSite
<VirtualHost *:80>
	ServerName localhost
	ServerAdmin webmaster@localhost

	<IfModule mod_rewrite.c>
		RewriteEngine On
		# Redirect to SSL version
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
	</IfModule>
</VirtualHost>

# Administration panel
<VirtualHost *:80>
	ServerName admin.localhost

	SetEnv APP_ID admin

	<IfModule mod_rewrite.c>
		RewriteEngine On
		# Redirect to SSL version
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
	</IfModule>
</VirtualHost>

# Api
<VirtualHost *:80>
	ServerName api.localhost

	SetEnv APP_ID api

	<IfModule mod_rewrite.c>
		RewriteEngine On
		# Redirect to SSL version
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
	</IfModule>
</VirtualHost>
